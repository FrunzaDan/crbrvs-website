<header class="navbar-wrapper">
  <nav class="navbar navbar-expand-sm" aria-label="Main navigation">
    <img
      (click)="scrollToSection('music')"
      (keydown.enter)="scrollToSection('music')"
      (keydown.space)="$event.preventDefault(); scrollToSection('music')"
      role="button"
      tabindex="0"
      class="nav-logo hover-item"
      ngSrc="/assets/images/crbrvs_logo.png"
      width="320"
      height="226"
      priority
      alt="CRBRVS Logo"
    />

    <app-hamburger-button
      [isOpen]="isMenuOpen()"
      (toggleMenu)="onToggleMenu($event)"
      controls="main-nav"
    ></app-hamburger-button>
    <div
      class="navbar-collapse justify-content-end"
      [class.show]="isMenuOpen()"
      id="main-nav"
    >
      <ul class="navbar-nav">
        <li class="nav-item">
          <a href="#music" class="nav-link" (click)="scrollToSection('music')"
            >Music</a
          >
        </li>
        <li class="nav-item">
          <a href="#merch" class="nav-link" (click)="scrollToSection('merch')"
            >Merch</a
          >
        </li>
        <li class="nav-item">
          <a
            href="#contact"
            class="nav-link"
            (click)="scrollToSection('contact')"
            >Contact</a
          >
        </li>
      </ul>
    </div>
  </nav>
  <h1 class="headline-intro-text">
    <span class="visually-hidden">CRBRVS: </span>Redefining rap.
  </h1>
  <div id="background-image-header"></div>
</header>
